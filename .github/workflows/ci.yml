name: CI

# Fast checks only: no model is called here. The model evaluations (backend/evals) need a live model and run by hand.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Settings from the example file (tests use a fake model)
        run: cp backend/.env.example backend/.env
      - name: Lint
        run: |
          uv --directory backend run ruff check . ../start.py
          uv --directory backend run ruff format --check . ../start.py
      - name: Tests
        run: uv --directory backend run pytest -m "not llm" -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
